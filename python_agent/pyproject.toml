[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-border-ecommerce-agent"
version = "0.1.0"
description = "Python-based cross-border e-commerce market research agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.7.1",
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
  "Flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
